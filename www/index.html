<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6ead8;--card:#fff8ec;--ink:#3b2314;--muted:#8a6a52;--accent:#d2691e;--line:#e5d2b8}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d130d;--card:#2a1c13;--ink:#f6e6d0;--muted:#b99677;--accent:#f0944d;--line:#43301f}}
:root[data-theme="dark"]{--bg:#1d130d;--card:#2a1c13;--ink:#f6e6d0;--muted:#b99677;--accent:#f0944d;--line:#43301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
h1{margin:10px 0 2px;font-size:26px;font-weight:900;letter-spacing:.5px}
h1 span{color:var(--accent)}
.stats{position:relative;z-index:3;display:flex;gap:8px;width:min(420px,94%);margin:6px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-size:22px;font-weight:900}
#time.low{color:#d23b2a}
.stage{position:relative;flex:1;min-height:0;width:min(420px,100%);display:flex;align-items:center;justify-content:center}
svg{height:100%;max-height:100%;width:auto;max-width:100%}
#cupg{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%}
#cupg.pop{animation:pop .14s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.93,1.06)}100%{transform:scale(1)}}
.steam path{fill:none;stroke:var(--muted);stroke-width:4;stroke-linecap:round;opacity:0}
.go .steam path{animation:st 2s infinite}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes st{0%{opacity:0;transform:translateY(8px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-14px)}}
.go .steam.k path{animation:stk 3.4s infinite}.steam.k path:nth-child(2){animation-delay:1.1s}.steam.k path:nth-child(3){animation-delay:2.2s}
@keyframes stk{0%{opacity:0;transform:translateY(8px)}15%{opacity:.55}70%{opacity:.3}100%{opacity:0;transform:translateY(-190px)}}
.stream{opacity:0}
.go .stream{opacity:1;animation:fl .25s linear infinite}
@keyframes fl{to{stroke-dashoffset:-12}}
.led{opacity:.35}.go .led{opacity:1}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;gap:8px;background:color-mix(in srgb,var(--bg) 82%,transparent);text-align:center;padding:20px;backdrop-filter:blur(3px);z-index:2}
#ov.hide{display:none}
#ov h2{margin:0;font-size:24px;font-weight:900}
#ov p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
#ov .big{font-size:56px;font-weight:900;color:var(--accent);line-height:1}
button{font-family:inherit;font-size:20px;font-weight:900;color:#fff;background:var(--accent);border:0;border-radius:16px;padding:12px 34px;margin-top:6px;box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.hint{color:var(--muted);font-size:13px;margin:4px 0 10px;min-height:20px}
#ov::before,#ov::after{content:'';margin:auto}
#shop{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.coins{font-size:18px;font-weight:900}
.up{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:right}
.ui{font-size:24px}
.ut{flex:1}.ut b{font-size:14px}
.ut small{display:block;color:var(--muted);font-size:11px;line-height:1.6}
#ovT:empty{display:none}
.chest{display:inline-block;color:var(--accent);font-weight:900;animation:chest .6s ease-out}
@keyframes chest{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
#cm{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#cm.show{display:flex}
.cw.big{transform:scale(1.7)}
.cw.big .cr{color:#ffd23f;font-size:18px}
.gc{width:48px;flex:none;opacity:.65}
.gc .csvg{width:48px;height:auto;max-width:none;max-height:none;display:block;overflow:visible}
.gc.rdy{opacity:1;cursor:pointer}
.gc.rdy .csvg{animation:shk 1.1s ease-in-out infinite}
.gc:not(.rdy) .glow{opacity:0;animation:none}
.gc.rdy .glow{opacity:.8;animation:glw 1.1s ease-in-out infinite}
@keyframes shk{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-3px) rotate(-9deg)}30%{transform:translateX(3px) rotate(9deg)}45%{transform:translateX(-2px) rotate(-6deg)}60%{transform:translateX(2px) rotate(5deg)}75%{transform:translateX(0) rotate(0)}}
.bar i.full{background:linear-gradient(90deg,#ffd23f,#ff9f1c)}
#chests{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cw{position:relative;width:120px;text-align:center;cursor:pointer;user-select:none}
.csvg{width:120px;height:auto;max-width:none;max-height:none;display:block;overflow:visible}
.csvg .lidc{transform-origin:60px 58px;transition:transform .3s ease,opacity .2s}
.csvg .lido{transform-origin:60px 58px;transform:scaleY(.1);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1) .12s,opacity .2s .12s}
.csvg .inside{opacity:0;transition:opacity .3s}
.csvg .glow{opacity:.35;animation:glw 1.4s ease-in-out infinite}
.cw.op .lidc{transform:translateY(-10px) scaleY(.15);opacity:0}
.cw.op .lido{transform:scaleY(1);opacity:1}
.cw.op .inside{opacity:1}
.cw.op .glow{opacity:1;animation:none}
.cw:not(.op) .csvg{animation:wob 1.3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}}
@keyframes glw{50%{opacity:.7}}
.cr{font-weight:900;color:var(--accent);min-height:24px;font-size:15px}
.cw.op .cr{animation:chest .6s ease-out}
#plate{opacity:0;transform-origin:150px 70px}
#plate.pl{animation:plp .9s ease-out}
@keyframes plp{0%{opacity:0;transform:translateY(24px) scale(.6)}25%{opacity:1;transform:translateY(0) scale(1.05)}70%{opacity:1;transform:translateY(-4px) scale(1)}100%{opacity:0;transform:translateY(-14px) scale(.95)}}
.flame{opacity:.35}
.go .flame{opacity:1}
.flame path{transform-box:fill-box;transform-origin:50% 100%}
.go .flame path{animation:flk .25s ease-in-out infinite alternate}
@keyframes flk{from{transform:scaleY(1)}to{transform:scaleY(1.25)}}
.rinfo{text-align:center;font-size:13px;color:var(--muted);line-height:1.8}.rinfo b{color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
.buy{font-size:13px;padding:8px 10px;margin:0;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
button:disabled{opacity:.5;pointer-events:none}
#mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;font-size:20px;padding:6px 10px;margin:0;border-radius:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.toast{position:absolute;left:50%;top:34%;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:24px;color:var(--accent);background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:6px 16px;pointer-events:none;animation:toast 1s forwards;z-index:1}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.6)}20%{opacity:1;transform:translateX(-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-40px)}}
#cupg.done{animation:done .45s ease-out}
@keyframes done{0%{transform:scale(1)}30%{transform:scale(1.12,.92)}60%{transform:scale(.95,1.08)}100%{transform:scale(1)}}
.spark{position:absolute;font-size:18px;pointer-events:none;animation:sp .8s forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.plus{position:absolute;font-weight:900;color:var(--accent);pointer-events:none;animation:up .6s forwards;font-size:22px}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
#bg{overflow:hidden}
#bgsvg{width:100%;height:100%;max-width:none;max-height:none;display:block}
#vg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(255,244,220,.22),rgba(255,244,220,0) 52%),radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.26) 100%)}
#svg{overflow:visible;max-width:80%}
h1,.hint{background:var(--card);padding:2px 16px;border-radius:14px;opacity:.95}
</style>
</head>

const bk=col=>`<defs><filter id="bk" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs><g filter="url(#bk)" opacity=".55" fill="${col}"><circle cx="26" cy="330" r="22"/><circle cx="378" cy="400" r="28"/><circle cx="48" cy="600" r="18"/><circle cx="360" cy="560" r="24"/><circle cx="120" cy="215" r="14"/><circle cx="292" cy="208" r="16"/></g>`;

const kbg=(w1,w2,op)=>{let jars='';['#c0392b','#e0a825','#6b8e23','#8b5a2b','#d35400','#a0522d'].forEach((c,i)=>{const x=82+i*40;jars+=`<rect x="${x}" y="280" width="20" height="26" rx="3" fill="#fff" opacity=".55" stroke="#8a7a66"/><rect x="${x+2}" y="288" width="16" height="16" rx="2" fill="${c}"/><rect x="${x}" y="276" width="20" height="5" rx="2" fill="#4a3a2a"/>`});let kn='';[[332,30],[347,40],[362,50],[377,36]].forEach(([x,L])=>{kn+=`<rect x="${x}" y="365" width="7" height="20" rx="3" fill="#3a2a1c"/><path d="M${x} 385h7v${L}l-7 6z" fill="#c9ced4"/>`});return `<defs><pattern id="tl" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="${w1}"/><rect x="1" y="1" width="38" height="18" rx="2" fill="${w2}"/></pattern></defs><rect width="400" height="800" fill="url(#tl)"/>${room('#000',op)}<rect x="70" y="306" width="260" height="7" rx="2" fill="#7b5a3a"/><rect x="70" y="313" width="260" height="12" fill="#000" opacity=".16"/>${jars}<rect x="322" y="360" width="70" height="5" rx="2" fill="#555"/>${kn}<g transform="rotate(-8 40 480)"><rect x="12" y="420" width="56" height="86" rx="8" fill="#c9965a"/><circle cx="40" cy="433" r="5" fill="#8a5d2b"/><path d="M20 452h40M20 472h40" stroke="#a87a42" stroke-width="2"/></g>`};
[['#e8e2d4','#f6f1e6'],['#f0cdb0','#fbe6d2'],['#bfdccb','#e3f4ea'],['#ecd98f','#fbf3c8'],['#cbbde4','#ebe3f6']].forEach(w=>{BG.push(kbg(w[0],w[1],.16));CTR.push(CTR[4])});
let pendSum=0;

  return `<svg viewBox="0 0 120 110" class="csvg"><defs><radialGradient id="gl${t}"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient></defs><ellipse cx="60" cy="104" rx="44" ry="5" fill="#000" opacity=".2"/><circle class="glow" cx="60" cy="62" r="56" fill="url(#gl${t})"/><g class="lido"><path d="M24 58L28 22Q60 8 92 22L96 58Z" fill="${C[1]}" stroke="${C[0]}" stroke-width="2"/><path d="M33 54L36 28Q60 17 84 28L87 54Z" fill="${C[0]}" opacity=".55"/><path d="M39 56L41 27M81 56L79 27" stroke="${C[2]}" stroke-width="5"/></g><g class="inside"><ellipse cx="60" cy="58" rx="39" ry="7" fill="#2b1a08"/><ellipse cx="60" cy="55" rx="34" ry="8" fill="#f2c14e"/><circle cx="42" cy="51" r="7" fill="#ffd966" stroke="#c9961a"/><circle cx="60" cy="46" r="8" fill="#ffd966" stroke="#c9961a"/><circle cx="78" cy="51" r="7" fill="#ffd966" stroke="#c9961a"/><circle cx="52" cy="54" r="6" fill="#ffe28a" stroke="#c9961a"/><circle cx="70" cy="55" r="6" fill="#ffe28a" stroke="#c9961a"/></g><rect x="20" y="58" width="80" height="44" rx="5" fill="${C[0]}"/><rect x="20" y="92" width="80" height="10" rx="4" fill="${C[1]}" opacity=".45"/><path d="M20 73h80M20 87h80" stroke="${C[1]}" stroke-width="2" opacity=".6"/><rect x="29" y="58" width="9" height="44" fill="${C[2]}"/><rect x="82" y="58" width="9" height="44" fill="${C[2]}"/><g fill="${C[1]}"><circle cx="33.5" cy="66" r="1.8"/><circle cx="33.5" cy="94" r="1.8"/><circle cx="86.5" cy="66" r="1.8"/><circle cx="86.5" cy="94" r="1.8"/></g><g class="lidc"><path d="M18 60V48Q18 28 60 28T102 48V60Z" fill="${C[0]}" stroke="${C[1]}" stroke-width="1.5"/><path d="M26 60V46Q27 33 34 31V60Z M86 31Q93 33 94 46V60H86Z" fill="${C[2]}"/><path d="M30 44Q40 34 60 33" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/><rect x="52" y="52" width="16" height="16" rx="3" fill="${C[2]}" stroke="${C[1]}"/><circle cx="60" cy="59" r="2.6" fill="${C[1]}"/><rect x="59" y="59" width="2" height="5" fill="${C[1]}"/></g></svg>`;
}
function burst(w){for(let i=0;i<10;i++){const p=document.createElement('div');p.className='spark';p.textContent='🪙';p.style.left='50px';p.style.top='36px';const a=Math.random()*6.283,d=50+Math.random()*50;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d-30+'px');w.appendChild(p);setTimeout(()=>p.remove(),800)}}
function claim(){
  if(gI>=GOALS.length||totC<GOALS[gI].c)return;
  const g=GOALS[gI],t=Math.min(2,Math.floor(gI/7));
  coins+=g.r;gI++;pendSum=g.r;save();renderShop();
  const cm=$('cm'),w=document.createElement('div');
  w.className='cw big';w.innerHTML=chestSVG(t)+'<div class="cr"></div>';
  $('cmi').innerHTML='';$('cmi').appendChild(w);cm.classList.add('show');cm.dataset.ok='';
  setTimeout(()=>{w.classList.add('op');w.querySelector('.cr').textContent='+'+fa(g.r)+' 🪙';pendSum=0;renderShop();burst(w);sndRecord();if(navigator.vibrate)try{navigator.vibrate(20)}catch(_){ }cm.dataset.ok='1'},450);
}
function renderChests(ch){
  const box=$('chests');box.innerHTML='';
  ch.forEach(c=>{
    const w=document.createElement('div');w.className='cw';
    w.innerHTML=chestSVG(c.t)+'<div class="cr">تپ کن!</div>';
    w.addEventListener('pointerdown',()=>{
      if(w.classList.contains('op'))return;
      w.classList.add('op');
      w.querySelector('.cr').textContent='+'+fa(c.r)+' 🪙';
      pendSum=Math.max(0,pendSum-c.r);$('coins').textContent=fc(coins-pendSum);
      burst(w);sndRecord();
      if(navigator.vibrate)try{navigator.vibrate(20)}catch(_){}
    });
    box.appendChild(w);
  });
}
function paint(){
  const k=vis===null?cafe:vis,kk=!!CF[k].kit;
  if(lastK!==k){lastK=k;$('bgsvg').innerHTML=BG[k];$('ctr').innerHTML=CTR[k];document.documentElement.setAttribute('data-theme',k===4?'dark':'light');$('rimg').style.display=k===4?'':'none';$('cb').setAttribute('stroke',k===4?'#ffd23f':'none');$('cb').setAttribute('stroke-width','1.2');$('d2c').setAttribute('stroke',k===4?'#ffd23f':'#000');$('d2c').setAttribute('stroke-opacity',k===4?'.8':'.3');
    $('mach').style.display=kk?'none':'';$('kit').style.display=kk?'':'none';
    $('cups').previousElementSibling.textContent=kk?'صبحانه سرو شده':'قهوه سرو شده';
    $('mInfo').previousElementSibling.textContent=kk?'اجاق گاز':'دستگاه اسپرسو';
    $('cInfo').previousElementSibling.textContent=kk?'مواد اولیه ممتاز':'قهوه ممتاز';
    $('mBuy').parentElement.querySelector('.ui').textContent=kk?'🔥':'⚙️';
    $('cBuy').parentElement.querySelector('.ui').textContent=kk?'🧈':'☕';
    $('tInfo').previousElementSibling.textContent=kk?'هدف سرو':'هدف فنجان';
    if($('ovTop').style.display==='none')$('ovP').innerHTML='۳۰ ثانیه وقت داری؛<br>هر چه سریع‌تر روی '+(kk?'ماهی‌تابه':'فنجون')+' بزن!';if(!playing)$('hint').textContent=kk?'روی ماهی‌تابه تپ کن 🍳':'روی فنجون تپ کن ☕';
  }
  if(kk){const kx=KX[Math.max(0,k-5)];$('kkn').setAttribute('stroke',kx[0]);$('kkl').setAttribute('stroke',kx[0]);$('krm').setAttribute('stroke',kx[1]);document.querySelectorAll('#sbody stop').forEach((s,i)=>s.setAttribute('stop-color',KP[Math.max(0,k-5)][i]));document.querySelectorAll('.stv').forEach((g,i)=>{g.style.display=(i===k-5)?'':'none'});return}
  document.querySelectorAll('#body stop').forEach((s,i)=>s.setAttribute('stop-color',BODY[k][i]));
  const cs=CUPS[k];
  document.querySelectorAll('#cup stop').forEach((s,i)=>s.setAttribute('stop-color',gold?CUPG[i]:cs.c[i]));
  $('band').setAttribute('fill',cs.b||'none');
  for(let i=1;i<=4;i++)$('d'+i).style.display=k>=i?'':'none';
}
let totC=0,gI=0;
try{const s=JSON.parse(localStorage.getItem('coffeerush_save')||'{}');coins=Math.max(0,Math.floor(+s.coins||0));cafe=Math.min(s.cafe|0,CF.length-1);rounds=s.rounds|0;if(s.v===3){mL=Math.min(s.mL|0,CF[cafe].MN.length-1);cL=Math.min(s.cL|0,CF[cafe].MN.length-1);totC=s.totC|0;gI=Math.min(s.gI|0,GOALS.length)}}catch(e){}
applyCafe();
const need=()=>MN[mL];
function save(){try{localStorage.setItem('coffeerush_save',JSON.stringify({v:3,coins,mL,cL,totC,gI,cafe,rounds}))}catch(e){}}
function renderShop(){
  $('coins').textContent=fc(coins-pendSum);
  $('mInfo').textContent='سطح '+fa(mL+1)+' از '+fa(NL)+(kt()?' · هر پنکیک ':' · هر فنجون ')+ft(MN[mL])+' تپ'+(mL<NL-1?' · بعدی: '+ft(MN[mL+1])+' تپ':'');
  $('cInfo').textContent='سطح '+fa(cL+1)+' از '+fa(NL)+(kt()?' · هر پنکیک ':' · هر قهوه ')+fa(CP[cL])+' 🪙'+(cL<NL-1?' · بعدی: '+fa(CP[cL+1])+' 🪙':'');
  const m=$('mBuy'),c=$('cBuy');
  m.textContent=mL<NL-1?'ارتقا ('+fc(MC[mL])+' 🪙)':'حداکثر';m.disabled=mL>=NL-1||coins<MC[mL];
  c.textContent=cL<NL-1?'ارتقا ('+fc(CC[cL])+' 🪙)':'حداکثر';c.disabled=cL>=NL-1||coins<CC[cL];
  const nr=rounds+1;
  $('rInfo').textContent=nr%10===0?'راند طلایی':'راند '+fa(nr);
  const cc=$('cafeCard');
  if(cafe<CF.length-1&&mL>=NL-1&&cL>=NL-1){cc.style.display='flex';$('cfI').textContent='';$('cfBuy').textContent=cfArmed?'مطمئنی؟':'خرید ('+fc(CF[cafe+1].p)+' 🪙)';$('cfBuy').disabled=coins<CF[cafe+1].p}else cc.style.display='none';
  const gc=$('gChest');
  if(gI<GOALS.length){const g=GOALS[gI],rdy=totC>=g.c;$('tInfo').textContent='جایزه: '+fc(g.r)+' 🪙 · '+fa(Math.min(totC,g.c))+' از '+fa(g.c)+(kt()?' سرو':' فنجون');$('tBar').style.width=Math.min(100,totC/g.c*100)+'%';$('tBar').classList.toggle('full',rdy);gc.className='gc'+(rdy?' rdy':'');gc.innerHTML=chestSVG(Math.min(2,Math.floor(gI/7)))}
  else{$('tInfo').textContent='همه‌ی هدف‌ها کامل شد! 🏆';$('tBar').style.width='100%';$('tBar').classList.add('full');gc.className='gc';gc.innerHTML=''}
  const old=rounds>=3||cafe>0||mL>0||cL>0||gI>0;
  document.querySelector('.coins').style.display=(rounds>=1||old)?'':'none';
  $('mBuy').parentElement.style.display=(rounds>=1||old)?'':'none';
  $('cBuy').parentElement.style.display=(mL>=1||cL>=1||cafe>0||gI>0)?'':'none';

try{muted=localStorage.getItem('coffeerush_mute')==='1'}catch(e){}
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,t0,d,type,vol){if(muted||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sndTap=n=>tone(320+n*45,0,.09,'triangle',.18);
const sndServe=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.18,'square',.1));
const sndRecord=()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.25,'triangle',.18));
const sndEnd=()=>{tone(330,0,.2,'sine',.15);tone(247,.18,.35,'sine',.15)};
try{best=parseInt(localStorage.getItem(KEY))||0}catch(e){}
$('best').textContent=fa(best);

function setPan(l){const rx=24+34*l,ry=rx*.26,m=(a,b)=>Math.round(a+(b-a)*l),e=$('pcake'),e2=$('pcake2');e.setAttribute('rx',rx);e.setAttribute('ry',ry);e.setAttribute('fill','rgb('+m(245,196)+','+m(226,130)+','+m(176,52)+')');e2.setAttribute('rx',rx*.78);e2.setAttribute('ry',ry*.72);e2.setAttribute('fill','rgb('+m(250,222)+','+m(238,160)+','+m(200,80)+')');e.style.opacity=l>0?1:0;e2.style.opacity=l>0?.7:0}
function setFill(full){
  const lvl=full?1:(need()<=3?0.7:cupTaps);
  if(kt()){setPan(lvl);return}
  const y=272-38*lvl;
  $('fill').setAttribute('y',y);
  $('crema').setAttribute('y',y);
  $('fill').style.opacity=lvl>0?1:0;
  $('crema').style.opacity=lvl>0?1:0;
}
let lastFx=0;
function served(){
  const now=performance.now();
  if(now-lastFx<400){const c0=tgt();c0.classList.remove('pop','done');void c0.getBoundingClientRect();c0.classList.add('done');return}
  lastFx=now;
  sndServe();
  const st=$('stage');
  const t=document.createElement('div');t.className='toast';t.textContent=kt()?(gold?'🌟 صبحانه طلایی سرو شد!':'🥞 صبحانه سرو شد!'):(gold?'🌟 قهوه طلایی سرو شد!':'☕ قهوه سرو شد!');
  st.appendChild(t);setTimeout(()=>t.remove(),1000);
  const r=$('svg').getBoundingClientRect(),s=st.getBoundingClientRect();
  const cx=r.left-s.left+r.width/2,cy=r.top-s.top+r.height*0.72;
  for(let i=0;i<8;i++){const a=i/8*6.283,p=document.createElement('div');p.className='spark';p.textContent=i%2?'✨':'⭐';p.style.left=cx+'px';p.style.top=cy+'px';p.style.setProperty('--dx',Math.cos(a)*70+'px');p.style.setProperty('--dy',Math.sin(a)*70-20+'px');st.appendChild(p);setTimeout(()=>p.remove(),800)}
  const c=tgt();c.classList.remove('pop','done');void c.getBoundingClientRect();c.classList.add('done');
  if(kt()){const pl=$('plate');pl.classList.remove('pl');void pl.getBoundingClientRect();pl.classList.add('pl')}
  setTimeout(()=>setFill(),280);
}
function start(){
  audio();vis=null;pendSum=0;$('chests').innerHTML='';gold=(rounds+1)%10===0;paint();taps=0;cups=0;cupTaps=0;$('cups').textContent=fa(0);playing=true;endAt=performance.now()+DUR;
  $('taps').textContent=fa(0);$('time').classList.remove('low');
  $('ov').classList.add('hide');$('svg').classList.add('go');
  $('hint').textContent='تند تند تپ کن! 🔥';
  setFill();cancelAnimationFrame(raf);tick();
}
function tick(){
  const left=Math.max(0,endAt-performance.now());
  $('time').textContent=fa(left/1000,1);
  $('time').classList.toggle('low',left<5000);
  if(left<=0){end();return}
  raf=requestAnimationFrame(tick);
}
function end(){
  playing=false;$('svg').classList.remove('go');
  const isNew=taps>best&&taps>0;
  if(isNew){best=taps;try{localStorage.setItem(KEY,String(best))}catch(e){}}
  $('best').textContent=fa(best);$('time').textContent=fa(0,1);
  $('ovTop').style.display='block';$('ovTop').textContent=fa(taps);
  $('ovT').textContent=isNew?'🏆 رکورد جدید!':'تمام شد!';
  const tps=fa(taps/(DUR/1000),1);
  const mult=gold?2:1,wasGold=gold;gold=false;paint();
  const earn=cups*CP[cL]*mult;coins+=earn;rounds++;
  totC+=cups;let tb=0,tm='';const ch=[];
  coins+=tb;save();renderShop();
  $('ovP').innerHTML=(kt()?'صبحانه':'قهوه')+' سرو شده: <b>'+fa(cups)+'</b> × '+fa(CP[cL])+(wasGold?' × ۲ 🌟':'')+' 🪙 = <b>+'+fc(earn)+' 🪙</b><br>'+'سرعت تو: <b>'+tps+'</b> تپ در ثانیه<br>'+(isNew?'بهترین رکوردت رو شکستی!':'بهترین رکورد: <b>'+fa(best)+'</b> تپ');
  const b=$('startBtn');b.textContent='دوباره';b.disabled=true;setTimeout(()=>{b.disabled=false},1200);
  $('ovP').innerHTML+=tm;isNew?sndRecord():sndEnd();
  $('ov').classList.remove('hide');
  $('hint').textContent='برای رکورد بیشتر دوباره بازی کن';
}
function hit(e){
  if(!playing)return;
  e.preventDefault();
  taps++;cupTaps+=1/need();$('taps').textContent=fa(taps);
  const done=cupTaps>=1-1e-9;
  if(done){cups++;cupTaps=Math.max(0,cupTaps-1);$('cups').textContent=fa(cups)}
  setFill(done&&need()>3);
  const c=tgt();c.classList.remove('pop','done');void c.getBoundingClientRect();c.classList.add('pop');
  const st=$('stage').getBoundingClientRect();
  const p=document.createElement('div');p.className='plus';p.textContent='+۱';
  p.style.left=(e.clientX-st.left-10)+'px';p.style.top=(e.clientY-st.top-20)+'px';
  $('stage').appendChild(p);setTimeout(()=>p.remove(),600);
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
  if(done)served();else sndTap(Math.round(cupTaps*9));
}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').addEventListener('click',()=>{audio();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem('coffeerush_mute',muted?'1':'0')}catch(e){}});
$('cupg').addEventListener('pointerdown',hit);
$('pan').addEventListener('pointerdown',hit);
$('startBtn').addEventListener('click',start);
$('mBuy').addEventListener('click',()=>{if(mL<NL-1&&coins>=MC[mL]){coins-=MC[mL];mL++;save();renderShop();audio();sndServe()}});
$('cBuy').addEventListener('click',()=>{if(cL<NL-1&&coins>=CC[cL]){coins-=CC[cL];cL++;save();renderShop();audio();sndServe()}});
$('cfBuy').addEventListener('click',()=>{
  if(cafe>=CF.length-1||coins<CF[cafe+1].p)return;
  if(!cfArmed){cfArmed=true;renderShop();setTimeout(()=>{cfArmed=false;renderShop()},3000);return}
  cfArmed=false;coins-=CF[cafe+1].p;cafe++;mL=0;cL=0;cupTaps=0;applyCafe();paint();save();renderShop();audio();sndRecord();setFill();
});
$('gChest').addEventListener('pointerdown',claim);
$('cm').addEventListener('pointerdown',()=>{if($('cm').dataset.ok==='1')$('cm').classList.remove('show')});
paint();renderShop();
setFill();
</script>
