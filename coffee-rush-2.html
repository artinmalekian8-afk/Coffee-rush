<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6ead8;--card:#fff8ec;--ink:#3b2314;--muted:#8a6a52;--accent:#d2691e;--line:#e5d2b8}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d130d;--card:#2a1c13;--ink:#f6e6d0;--muted:#b99677;--accent:#f0944d;--line:#43301f}}
:root[data-theme="dark"]{--bg:#1d130d;--card:#2a1c13;--ink:#f6e6d0;--muted:#b99677;--accent:#f0944d;--line:#43301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
h1{margin:10px 0 2px;font-size:26px;font-weight:900;letter-spacing:.5px}
h1 span{color:var(--accent)}
.stats{display:flex;gap:8px;width:min(420px,94%);margin:6px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-size:22px;font-weight:900}
#time.low{color:#d23b2a}
.stage{position:relative;flex:1;min-height:0;width:min(420px,100%);display:flex;align-items:center;justify-content:center}
svg{height:100%;max-height:100%;width:auto;max-width:100%}
#cupg{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%}
#cupg.pop{animation:pop .14s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.93,1.06)}100%{transform:scale(1)}}
.steam path{fill:none;stroke:var(--muted);stroke-width:4;stroke-linecap:round;opacity:0}
.go .steam path{animation:st 2s infinite}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes st{0%{opacity:0;transform:translateY(8px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-14px)}}
.stream{opacity:0}
.go .stream{opacity:1;animation:fl .25s linear infinite}
@keyframes fl{to{stroke-dashoffset:-12}}
.led{opacity:.35}.go .led{opacity:1}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;gap:8px;background:color-mix(in srgb,var(--bg) 82%,transparent);text-align:center;padding:20px;backdrop-filter:blur(3px);z-index:2}
#ov.hide{display:none}
#ov h2{margin:0;font-size:24px;font-weight:900}
#ov p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
#ov .big{font-size:56px;font-weight:900;color:var(--accent);line-height:1}
button{font-family:inherit;font-size:20px;font-weight:900;color:#fff;background:var(--accent);border:0;border-radius:16px;padding:12px 34px;margin-top:6px;box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.hint{color:var(--muted);font-size:13px;margin:4px 0 10px;min-height:20px}
#ov::before,#ov::after{content:'';margin:auto}
#shop{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.coins{font-size:18px;font-weight:900}
.up{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:right}
.ui{font-size:24px}
.ut{flex:1}.ut b{font-size:14px}
.ut small{display:block;color:var(--muted);font-size:11px;line-height:1.6}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
.buy{font-size:13px;padding:8px 10px;margin:0;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
button:disabled{opacity:.5;pointer-events:none}
#mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;font-size:20px;padding:6px 10px;margin:0;border-radius:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.toast{position:absolute;left:50%;top:34%;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:24px;color:var(--accent);background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:6px 16px;pointer-events:none;animation:toast 1s forwards;z-index:1}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.6)}20%{opacity:1;transform:translateX(-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-40px)}}
#cupg.done{animation:done .45s ease-out}
@keyframes done{0%{transform:scale(1)}30%{transform:scale(1.12,.92)}60%{transform:scale(.95,1.08)}100%{transform:scale(1)}}
.spark{position:absolute;font-size:18px;pointer-events:none;animation:sp .8s forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.plus{position:absolute;font-weight:900;color:var(--accent);pointer-events:none;animation:up .6s forwards;font-size:22px}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
</style>
</head>
<body>
<button id="mute" aria-label="صدا">🔊</button>
<h1>Coffee <span>Rush</span> ☕</h1>
<div class="stats">
  <div class="stat"><small>زمان</small><b id="time">۳۰٫۰</b></div>
  <div class="stat"><small>تپ این راند</small><b id="taps">۰</b></div>
  <div class="stat"><small>بهترین رکورد</small><b id="best">۰</b></div>
  <div class="stat"><small>قهوه سرو شده</small><b id="cups">۰</b></div>
</div>
<div class="stage" id="stage">
<svg id="svg" viewBox="0 0 300 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#8e2a1f"/><stop offset=".35" stop-color="#d4503a"/><stop offset=".7" stop-color="#b53a28"/><stop offset="1" stop-color="#7a2217"/></linearGradient>
    <linearGradient id="chrome" x1="0" x2="1"><stop offset="0" stop-color="#8d949b"/><stop offset=".4" stop-color="#f1f4f6"/><stop offset="1" stop-color="#7c838a"/></linearGradient>
    <linearGradient id="cup" x1="0" x2="1"><stop offset="0" stop-color="#d9d3ca"/><stop offset=".4" stop-color="#fff"/><stop offset="1" stop-color="#c4bdb2"/></linearGradient>
    <clipPath id="cc"><path d="M120 222h60l-6 44q-1 6-8 6h-32q-7 0-8-6z"/></clipPath>
  </defs>
  <!-- machine body -->
  <rect x="30" y="14" width="240" height="262" rx="26" fill="url(#body)"/>
  <rect x="30" y="14" width="240" height="64" rx="26" fill="#000" opacity=".18"/>
  <rect x="44" y="20" width="212" height="8" rx="4" fill="#fff" opacity=".25"/>
  <!-- gauge -->
  <circle cx="82" cy="52" r="22" fill="url(#chrome)"/><circle cx="82" cy="52" r="17" fill="#1c1c1c"/>
  <path d="M70 58a13 13 0 0 1 24 0" fill="none" stroke="#7bd88f" stroke-width="3"/>
  <line x1="82" y1="52" x2="91" y2="43" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- knob and leds -->
  <circle cx="218" cy="52" r="17" fill="url(#chrome)"/><rect x="215" y="38" width="6" height="14" rx="3" fill="#333"/>
  <circle class="led" cx="140" cy="46" r="5" fill="#5be37d"/><circle class="led" cx="158" cy="46" r="5" fill="#ffb84d"/>
  <!-- group head -->
  <rect x="100" y="106" width="100" height="46" rx="10" fill="url(#chrome)"/>
  <rect x="108" y="150" width="84" height="16" rx="6" fill="#2b2b2b"/>
  <rect x="114" y="166" width="72" height="12" rx="5" fill="url(#chrome)"/>
  <rect x="132" y="178" width="10" height="10" rx="2" fill="#2b2b2b"/><rect x="158" y="178" width="10" height="10" rx="2" fill="#2b2b2b"/>
  <!-- cavity -->
  <rect x="62" y="190" width="176" height="86" rx="10" fill="#1a0f0a" opacity=".85"/>
  <!-- streams -->
  <g class="stream-g">
    <line class="stream" id="s1" x1="137" y1="188" x2="137" y2="262" stroke="#5a3118" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 4"/>
    <line class="stream" id="s2" x1="163" y1="188" x2="163" y2="262" stroke="#5a3118" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 4"/>
  </g>
  <!-- steam -->
  <g class="steam"><path d="M138 214q-8-10 0-18"/><path d="M150 212q-8-10 0-18"/><path d="M162 214q-8-10 0-18"/></g>
  <!-- cup (tap target) -->
  <g id="cupg">
    <rect x="100" y="190" width="100" height="90" fill="transparent"/>
    <path d="M180 232h6a12 12 0 0 1 0 24h-8" fill="none" stroke="url(#cup)" stroke-width="6"/>
    <path d="M120 222h60l-6 44q-1 6-8 6h-32q-7 0-8-6z" fill="url(#cup)"/>
    <g clip-path="url(#cc)"><rect id="fill" x="110" y="272" width="80" height="50" fill="#5a3118"/>
      <rect id="crema" x="110" y="272" width="80" height="3" fill="#c98a4e"/></g>
    <ellipse cx="150" cy="222" rx="30" ry="4" fill="#fff" opacity=".5"/>
  </g>
  <!-- drip tray -->
  <rect x="46" y="274" width="208" height="18" rx="7" fill="url(#chrome)"/>
  <rect x="58" y="279" width="184" height="4" rx="2" fill="#555" opacity=".5"/>
  <rect x="62" y="292" width="176" height="10" rx="4" fill="#2b2b2b"/>
</svg>
<div id="ov">
  <div id="ovTop" class="big" style="display:none"></div>
  <h2 id="ovT">Coffee Rush</h2>
  <p id="ovP">۳۰ ثانیه وقت داری؛<br>هر چه سریع‌تر روی فنجون بزن!</p>
  <button id="startBtn">شروع بازی</button>
  <div id="shop">
    <div class="coins">🪙 <b id="coins">۰</b></div>
    <div class="up"><div class="ui">⚙️</div><div class="ut"><b>دستگاه اسپرسو</b><small id="mInfo"></small></div><button class="buy" id="mBuy"></button></div>
    <div class="up"><div class="ui">☕</div><div class="ut"><b>قهوه ممتاز</b><small id="cInfo"></small></div><button class="buy" id="cBuy"></button></div>
    <div class="up"><div class="ui">🎯</div><div class="ut"><b>هدف تپ (مجموع همه‌ی راندها)</b><small id="tInfo"></small><div class="bar"><i id="tBar"></i></div></div></div>
  </div>
</div>
</div>
<div class="hint" id="hint">روی فنجون تپ کن ☕</div>

<script>
const $=id=>document.getElementById(id);
const fa=(n,d=0)=>Number(n).toLocaleString('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:false});
const DUR=30000,KEY='coffeerush_best';
let best=0,taps=0,playing=false,endAt=0,raf=0,muted=false,AC=null;
let cups=0,cupTaps=0,coins=0,mL=0,cL=0;
const MN=[15,12,10,8,6],CP=[2,3,4,6,8],MC=[80,200,450,900],CC=[60,160,380,800];
const TG=[500,800,1200,2000,3000,5000,8000,12000],TR=[10,15,25,40,60,100,150,250];
let totT=0,tI=0;
try{const s=JSON.parse(localStorage.getItem('coffeerush_save')||'{}');coins=s.coins|0;mL=Math.min(s.mL|0,4);cL=Math.min(s.cL|0,4);totT=s.totT|0;tI=Math.min(s.tI|0,TG.length)}catch(e){}
const need=()=>MN[mL];
function save(){try{localStorage.setItem('coffeerush_save',JSON.stringify({coins,mL,cL,totT,tI}))}catch(e){}}
function renderShop(){
  $('coins').textContent=fa(coins);
  $('mInfo').textContent='سطح '+fa(mL+1)+' از ۵ · هر فنجون '+fa(MN[mL])+' تپ'+(mL<4?' · بعدی: '+fa(MN[mL+1])+' تپ':'');
  $('cInfo').textContent='سطح '+fa(cL+1)+' از ۵ · هر قهوه '+fa(CP[cL])+' 🪙'+(cL<4?' · بعدی: '+fa(CP[cL+1])+' 🪙':'');
  const m=$('mBuy'),c=$('cBuy');
  m.textContent=mL<4?'ارتقا ('+fa(MC[mL])+' 🪙)':'حداکثر';m.disabled=mL>=4||coins<MC[mL];
  c.textContent=cL<4?'ارتقا ('+fa(CC[cL])+' 🪙)':'حداکثر';c.disabled=cL>=4||coins<CC[cL];
  if(tI<TG.length){$('tInfo').textContent='جایزه: '+fa(TR[tI])+' 🪙 · '+fa(Math.min(totT,TG[tI]))+' از '+fa(TG[tI])+' تپ';$('tBar').style.width=Math.min(100,totT/TG[tI]*100)+'%'}
  else{$('tInfo').textContent='همه‌ی هدف‌ها کامل شد! 🏆';$('tBar').style.width='100%'}
}
try{muted=localStorage.getItem('coffeerush_mute')==='1'}catch(e){}
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,t0,d,type,vol){if(muted||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sndTap=n=>tone(320+n*45,0,.09,'triangle',.18);
const sndServe=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.18,'square',.1));
const sndRecord=()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.25,'triangle',.18));
const sndEnd=()=>{tone(330,0,.2,'sine',.15);tone(247,.18,.35,'sine',.15)};
try{best=parseInt(localStorage.getItem(KEY))||0}catch(e){}
$('best').textContent=fa(best);

function setFill(full){
  const lvl=full?1:cupTaps/need();
  const y=272-46*lvl;
  $('fill').setAttribute('y',y);
  $('crema').setAttribute('y',y);
  $('fill').style.opacity=lvl>0?1:0;
  $('crema').style.opacity=lvl>0?1:0;
}
function served(){
  sndServe();
  const st=$('stage');
  const t=document.createElement('div');t.className='toast';t.textContent='☕ قهوه سرو شد!';
  st.appendChild(t);setTimeout(()=>t.remove(),1000);
  const r=$('svg').getBoundingClientRect(),s=st.getBoundingClientRect();
  const cx=r.left-s.left+r.width/2,cy=r.top-s.top+r.height*0.72;
  for(let i=0;i<8;i++){const a=i/8*6.283,p=document.createElement('div');p.className='spark';p.textContent=i%2?'✨':'⭐';p.style.left=cx+'px';p.style.top=cy+'px';p.style.setProperty('--dx',Math.cos(a)*70+'px');p.style.setProperty('--dy',Math.sin(a)*70-20+'px');st.appendChild(p);setTimeout(()=>p.remove(),800)}
  const c=$('cupg');c.classList.remove('pop','done');void c.getBoundingClientRect();c.classList.add('done');
  setTimeout(()=>setFill(),280);
}
function start(){
  audio();taps=0;cups=0;cupTaps=0;$('cups').textContent=fa(0);playing=true;endAt=performance.now()+DUR;
  $('taps').textContent=fa(0);$('time').classList.remove('low');
  $('ov').classList.add('hide');$('svg').classList.add('go');
  $('hint').textContent='تند تند تپ کن! 🔥';
  setFill();cancelAnimationFrame(raf);tick();
}
function tick(){
  const left=Math.max(0,endAt-performance.now());
  $('time').textContent=fa(left/1000,1);
  $('time').classList.toggle('low',left<5000);
  if(left<=0){end();return}
  raf=requestAnimationFrame(tick);
}
function end(){
  playing=false;$('svg').classList.remove('go');
  const isNew=taps>best&&taps>0;
  if(isNew){best=taps;try{localStorage.setItem(KEY,String(best))}catch(e){}}
  $('best').textContent=fa(best);$('time').textContent=fa(0,1);
  $('ovTop').style.display='block';$('ovTop').textContent=fa(taps);
  $('ovT').textContent=isNew?'🏆 رکورد جدید!':'تمام شد!';
  const tps=fa(taps/(DUR/1000),1);
  const earn=cups*CP[cL];coins+=earn;
  totT+=taps;let tb=0,tm='';
  while(tI<TG.length&&totT>=TG[tI]){tb+=TR[tI];tm+='<br>🎯 هدف '+fa(TG[tI])+' تپ کامل شد! +'+fa(TR[tI])+' 🪙';tI++}
  coins+=tb;save();renderShop();
  $('ovP').innerHTML='قهوه سرو شده: <b>'+fa(cups)+'</b> × '+fa(CP[cL])+' 🪙 = <b>+'+fa(earn)+' 🪙</b><br>'+'سرعت تو: <b>'+tps+'</b> تپ در ثانیه<br>'+(isNew?'بهترین رکوردت رو شکستی!':'بهترین رکورد: <b>'+fa(best)+'</b> تپ');
  const b=$('startBtn');b.textContent='دوباره';b.disabled=true;setTimeout(()=>{b.disabled=false},1200);
  $('ovP').innerHTML+=tm;isNew?sndRecord():sndEnd();
  $('ov').classList.remove('hide');
  $('hint').textContent='برای رکورد بیشتر دوباره بازی کن';
}
function hit(e){
  if(!playing)return;
  e.preventDefault();
  taps++;cupTaps++;$('taps').textContent=fa(taps);
  const done=cupTaps>=need();
  if(done){cups++;cupTaps=0;$('cups').textContent=fa(cups)}
  setFill(done);
  const c=$('cupg');c.classList.remove('pop','done');void c.getBoundingClientRect();c.classList.add('pop');
  const st=$('stage').getBoundingClientRect();
  const p=document.createElement('div');p.className='plus';p.textContent='+۱';
  p.style.left=(e.clientX-st.left-10)+'px';p.style.top=(e.clientY-st.top-20)+'px';
  $('stage').appendChild(p);setTimeout(()=>p.remove(),600);
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
  if(done)served();else sndTap(Math.round(cupTaps/need()*9));
}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').addEventListener('click',()=>{audio();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem('coffeerush_mute',muted?'1':'0')}catch(e){}});
$('cupg').addEventListener('pointerdown',hit);
$('startBtn').addEventListener('click',start);
$('mBuy').addEventListener('click',()=>{if(mL<4&&coins>=MC[mL]){coins-=MC[mL];mL++;save();renderShop();audio();sndServe()}});
$('cBuy').addEventListener('click',()=>{if(cL<4&&coins>=CC[cL]){coins-=CC[cL];cL++;save();renderShop();audio();sndServe()}});
renderShop();
setFill();
</script>
</body>
</html>
