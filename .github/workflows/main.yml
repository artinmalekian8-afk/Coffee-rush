name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow
      - run: python make_icon.py
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > release.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BT}apksigner sign --ks release.p12 --ks-pass pass:coffeerush123 --key-pass pass:coffeerush123 --out coffee-rush.apk android/app/build/outputs/apk/debug/app-debug.apk
          ${BT}apksigner verify --print-certs coffee-rush.apk
      - uses: actions/upload-artifact@v4
        with:
          name: coffee-rush-apk
          path: coffee-rush.apk
